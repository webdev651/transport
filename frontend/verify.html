<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify Pass · TransitPass</title>
<meta name="description" content="The same checks drivers use: the QR code is validated against the database and the attempt is logged under your account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dash">
<div class="shell">
  <div class="mobile-bar">
    <button id="navToggle" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar"><span></span><span></span><span></span></button>
    <div class="brand-mark" style="width:2rem;height:2rem;font-size:.8rem">TP</div>
    <p style="margin:0;font-family:var(--font-display);font-size:.85rem;font-weight:700">TransitPass</p>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">TP</div>
      <div>
        <p>TransitPass</p>
        <p class="label-caps muted">Verification &amp; Management System</p>
      </div>
      <button id="navClose" class="nav-close" aria-label="Close menu">&times;</button>
    </div>
    <nav class="nav"></nav>
    <div class="sidebar-foot">
      <p class="label-caps muted" style="margin:0">Signed in</p>
      <p id="adminWho" style="margin:.25rem 0 0;font-size:.875rem;font-weight:500">…</p>
      <p class="muted" id="adminNode" style="margin:0;font-size:.75rem"></p>
      <button id="logout" style="margin-top:.75rem;width:100%">Log out</button>
    </div>
  </aside>
  <main>
    <header class="hero">
      <p class="label-caps" style="color:var(--accent);margin:0 0 .75rem">Administrator</p>
      <h1>Verify Pass</h1>
      <p class="muted" style="margin:.5rem 0 0;max-width:42rem;font-size:.875rem">The same checks drivers use: the QR code is validated against the database and the attempt is logged under your account.</p>
    </header>
    <div class="page stack">
      <div style="display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr))">
        <div class="stack" id="scanner" style="min-width:0"></div>
        <article class="card" style="min-width:0">
          <div class="section-title"><h2 style="font-size:1.05rem">Latest scans (all drivers)</h2><a class="label-caps" href="admin-scan-history.html" style="color:var(--accent)">History →</a></div>
          <div id="feed"></div>
        </article>
      </div>
    </div>
  </main>
</div>
<script src="js/qrcode-gen.js"></script>
<script src="js/app.js"></script>
<script src="js/scanner.js"></script>
<script>
(async () => {
  if (!(await requireStaff(["admin"]))) return;

  const refresh = async () => renderFeed(document.getElementById("feed"), (await api("/scans/feed?limit=8")).items);
  TPScanner.mount(document.getElementById("scanner"), { onResult: () => refresh().catch(() => {}) });
  await refresh();

})();
</script>
<script src="js/shell.js"></script>
<script src="js/motion.js"></script>
</body>
</html>
