<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications · TransitPass</title>
<meta name="description" content="Messages from the administrator about your account, documents and service.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/driver.css">
</head>
<body class="dash">
<div class="shell">
  <div class="mobile-bar">
    <button id="navToggle" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar"><span></span><span></span><span></span></button>
    <div class="brand-mark" style="width:2rem;height:2rem;font-size:.8rem">TP</div>
    <p style="margin:0;font-family:var(--font-display);font-size:.85rem;font-weight:700">TransitPass</p>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">TP</div>
      <div>
        <p>TransitPass</p>
        <p class="label-caps muted">Verification &amp; Management System</p>
      </div>
      <button id="navClose" class="nav-close" aria-label="Close menu">&times;</button>
    </div>
    <nav class="nav"></nav>
    <div class="sidebar-foot">
      <p class="label-caps muted" style="margin:0">Signed in</p>
      <p id="adminWho" style="margin:.25rem 0 0;font-size:.875rem;font-weight:500">…</p>
      <p class="muted" id="adminNode" style="margin:0;font-size:.75rem"></p>
      <button id="logout" style="margin-top:.75rem;width:100%">Log out</button>
    </div>
  </aside>
  <main>
    <header class="hero">
      <p class="label-caps" style="color:var(--accent);margin:0 0 .75rem">Driver</p>
      <h1>Notifications</h1>
      <p class="muted" style="margin:.5rem 0 0;max-width:42rem;font-size:.875rem">Messages from the administrator about your account, documents and service.</p>
    </header>
    <div class="page stack">
      <article class="card dp-in">
        <div class="dp-tools">
          <div class="grow"><div class="dp-tabs" role="tablist" id="tabs"><button class="on" data-f="all">All<span class="c" id="cAll">0</span></button><button data-f="unread">Unread<span class="c u" id="cUn">0</span></button><button data-f="read">Read<span class="c" id="cRead">0</span></button></div>
            <select id="cat" aria-label="Filter by type" style="width:12rem"><option value="all">All types</option><option value="account_status">Account &amp; documents</option><option value="announcement">Announcements</option><option value="refund">Refunds</option><option value="general">General</option></select></div>
          <button class="primary" id="readAll">Mark all as read</button>
        </div>
        <div class="dp-notifs" id="list" aria-live="polite"></div>
        <div class="row" style="margin-top:1rem;justify-content:center"><button id="more" hidden>Load more</button></div>
      </article>
    </div>
  </main>
</div>
<script src="js/qrcode-gen.js"></script>
<script src="js/app.js"></script>
<script src="js/driver.js"></script>
<script>
(async () => {
  if (!(await requireStaff(["driver"]))) return;
  const PAGE = 20, $ = (id) => document.getElementById(id);
  let filter = "all", offset = 0;
  const CAT = { account_status: ["id", "Account"], announcement: ["mega", "Announcement"], refund: ["refund", "Refund"], general: ["bell", "General"], qr_expiry: ["clock", "Reminder"], eligibility_expiry: ["clock", "Reminder"] };
  const card = (n, i) => { const c = CAT[n.category] || CAT.general; return `<div class="dp-n c-${esc(n.category)} ${n.read ? "" : "unread"} dp-in" style="--i:${Math.min(i, 8)}" data-id="${n.id}" tabindex="0" role="button" aria-expanded="false">
      <div class="ico">${dpIcon(c[0])}</div><div class="txt"><h4>${n.read ? "" : '<span class="dot" aria-label="Unread"></span>'}${esc(n.title)}</h4><p>${esc(n.body)}</p>
      <div class="meta"><span>${fmtDateTime(n.createdAt)}</span><span>${esc(n.sentBy)}</span></div></div>
      <div class="side"><span class="tag">${esc(c[1])}</span><button type="button" data-read ${n.read ? "hidden" : ""}>Mark as read</button></div></div>`; };
  function counts(d) { $("cAll").textContent = d.all; $("cUn").textContent = d.unread; $("cUn").classList.toggle("zero", !d.unread); $("cRead").textContent = d.read; $("readAll").disabled = !d.unread; dpPaintCounter(d.unread); }
  async function load(append) {
    if (!append) offset = 0;
    const d = await api(`/driver/notifications?limit=${PAGE}&offset=${offset}&filter=${filter}&category=${$("cat").value}`);
    counts(d);
    const html = d.items.map((n, i) => card(n, i)).join("");
    if (!append) $("list").innerHTML = html || dpEmpty("inbox", filter === "unread" ? "You're all caught up" : "No notifications", filter === "unread" ? "No unread notifications." : "Messages from the administrator appear here.");
    else $("list").insertAdjacentHTML("beforeend", html);
    offset += d.items.length; $("more").hidden = offset >= d.total;
  }
  async function markRead(el) {
    if (!el.classList.contains("unread")) return;
    await api(`/driver/notifications/${el.dataset.id}/read`, { method: "POST" });
    el.classList.remove("unread"); el.querySelector(".dot")?.remove(); el.querySelector("[data-read]").hidden = true;
    const d = await api("/driver/notifications?limit=1"); counts(d);
    if (filter === "unread") { el.style.opacity = ".4"; setTimeout(() => load(false).catch(() => {}), 350); }
  }
  $("list").addEventListener("click", (e) => { const el = e.target.closest(".dp-n"); if (!el) return;
    if (e.target.closest("[data-read]")) { e.stopPropagation(); markRead(el).catch((x) => showToast(errText(x))); return; }
    const open = el.classList.toggle("open"); el.setAttribute("aria-expanded", open); if (open) markRead(el).catch((x) => showToast(errText(x))); });
  $("list").addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("dp-n")) { e.preventDefault(); e.target.click(); } });
  $("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; filter = b.dataset.f; [...$("tabs").children].forEach((x) => x.classList.toggle("on", x === b)); load(false).catch((x) => showToast(errText(x))); });
  $("cat").addEventListener("change", () => load(false).catch((x) => showToast(errText(x))));
  $("more").onclick = (e) => guarded(e.target, () => load(true));
  $("readAll").onclick = (e) => guarded(e.target, async () => { const r = await api("/driver/notifications/read-all", { method: "POST" }); showToast(r.message); await load(false); });
  try { await load(false); } catch (e) { showToast(errText(e)); }
})();
</script>
<script src="js/shell.js"></script>
<script src="js/motion.js"></script>
</body>
</html>
